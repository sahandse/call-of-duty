name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/cod-objectives-page-8d563k', 'main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /call-of-duty

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

      - name: Enable / update GitHub Pages
        run: |
          # Try POST (create) first
          RESP=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sahandse/call-of-duty/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "POST status: $CODE"
          echo "POST body: $BODY"

          # If already exists (409), try PUT to update
          if [ "$CODE" = "409" ] || [ "$CODE" = "422" ]; then
            echo "Trying PUT (update)..."
            RESP2=$(curl -s -w "\n%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/sahandse/call-of-duty/pages \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
            echo "PUT status: $(echo "$RESP2" | tail -n 1)"
            echo "PUT body: $(echo "$RESP2" | head -n -1)"
          fi

          # GET current state
          echo "--- Current Pages state ---"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sahandse/call-of-duty/pages || true
